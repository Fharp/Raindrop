<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雨窗</title>
<style>
html,body{margin:0;height:100%;background:#05080a;overflow:hidden}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}

/* 闪电：整屏一层，亮点位置跟着雷的 pan 走 */
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen}

#play{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  min-width:84px;height:84px;padding:0 16px;border-radius:42px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(8,12,14,.35);color:rgba(255,255,255,.9);
  font:400 15px/1 ui-monospace,Consolas,monospace;letter-spacing:.02em;
  cursor:pointer;backdrop-filter:blur(8px);transition:opacity .8s;
}
#play .glyph{font-size:30px}
#play:hover{background:rgba(8,12,14,.55)}
#play:disabled{cursor:default}
#play.hidden{opacity:0;pointer-events:none}

#where{
  position:fixed;left:0;right:0;bottom:26px;text-align:center;
  font:12px/1.6 ui-monospace,Consolas,monospace;color:rgba(255,255,255,.34);
  opacity:0;transition:opacity 1.6s;pointer-events:none;
}
#where.on{opacity:1}

#hud{position:fixed;right:10px;top:10px;font:12px/1.7 ui-monospace,Consolas,monospace;
     color:rgba(255,255,255,.85);background:rgba(0,0,0,.45);padding:10px 12px;border-radius:6px;user-select:none}
#hud label{display:block;white-space:nowrap}
#hud input{width:150px;vertical-align:middle}
#hud b{display:inline-block;width:3.4em;text-align:right;font-weight:400}
#err{position:fixed;left:12px;bottom:12px;margin:0;color:#e88;font:12px/1.5 monospace;white-space:pre-wrap;max-width:60vw}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="flash"></div>
<button id="play"><span class="glyph">&#9205;</span></button>
<div id="where"></div>

<!-- raindrop-fx 的预打包文件，见 SPEC-VIEW.md 第 1 节 -->
<script src="bundle/index.js"></script>
<script src="rain_eq.js"></script>
<script src="rain_audio.js"></script>
<script src="rain_bridge.js"></script>
<script>
(async function () {
"use strict";
const q   = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(q.get(k)); return Number.isFinite(v) ? v : d; };
const $   = s => document.querySelector(s);
const btn = $("#play"), where = $("#where");

function fail(e) {
  let pre = $("#err");
  if (!pre) { pre = document.createElement("pre"); pre.id = "err"; document.body.appendChild(pre); }
  pre.textContent = String((e && e.message) || e);
  console.error(e);
}

// ── 画布。像素比压到 1.5 封顶：上千颗水珠的合成是逐像素的，全分辨率不值当。
const canvas = $("#view");
const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
const fit = () => {
  canvas.width  = Math.round(innerWidth  * dpr);
  canvas.height = Math.round(innerHeight * dpr);
};
fit();

if (typeof RaindropFX === "undefined") {
  fail("缺 bundle/index.js。到 github.com/SardineFish/raindrop-fx 取 bundle/index.js，放进 bundle/ 目录。");
  return;
}

const fx = new RaindropFX({
  canvas,
  background: q.get("img") || "1.jpg",
  // 起手参数只定量级；逐帧的值由 rain_bridge 覆写
  spawnLimit: 1400,
  backgroundBlurSteps: 4,
  mist: true,
  mistBlurStep: 5,
  mistColor: [0.035, 0.042, 0.05, 1],     // 雾偏冷，配底图的青调
  refractBase: 0.42,
  refractScale: 0.62,
  raindropCompose: "smoother",
  raindropLightPos: [-1, 1, 2, 0],
  raindropDiffuseLight: [0.22, 0.24, 0.26],
  raindropSpecularLight: [0, 0, 0],
  raindropShadowOffset: 0.75,
  raindropLightBump: 0.7,
  smoothRaindrop: [0.955, 0.995],
});
window.fx = fx;

const bridge = RainBridge.attach(fx, null, $("#flash"));
window.bridge = bridge;
try { await bridge.start(); }
catch (e) { fail("WebGL2 起不来，或底图取不到：" + (e.message || e)); return; }

addEventListener("resize", () => { fit(); fx.resize(canvas.width, canvas.height); });

// ── 音频。素材约 120 MB，第一次要等；进度写在按钮上。
let audio = null;
btn.addEventListener("click", async () => {
  if (audio) { audio.playing ? audio.stop() : audio.play(); return; }
  btn.disabled = true;
  btn.innerHTML = '<span id="prog">读取中…</span>';
  const prog = $("#prog");
  try {
    audio = await RainAudio.create({
      root: "./",
      secPerFrame: num("sec", 3600),        // ?sec=30 压缩倍速，用来快速看一场雨的全程
      volume: num("vol", 0.7),
    }, m => { prog.textContent = m; });
    bridge.audio = audio;
    const info = await audio.pickRandom();
    await audio.play();
    btn.classList.add("hidden");
    if (info) {
      const s = info.summary || {};
      where.textContent = info.cityName + " · " + String(s.start_local || "").replace("T", " ")
        + " · " + info.hours + " 小时 · 峰值 "
        + (s.liquid_peak_mm != null ? s.liquid_peak_mm + " mm/h" : "—");
      where.classList.add("on");
      setTimeout(() => where.classList.remove("on"), 9000);
    }
    audio.onend = () => audio.pickRandom().then(() => audio.play()).catch(fail);
  } catch (e) {
    btn.disabled = false;
    btn.innerHTML = '<span class="glyph">&#9205;</span>';
    fail(e);
  }
});

// ── 无界面的调试入口
//   空格 播放/停止    0–9 空转时的雨强    ←/→ 空转时的风    D 换一场雨
addEventListener("keydown", e => {
  if (e.key === " ") btn.click();
  else if (e.key >= "0" && e.key <= "9") RainBridge.CFG.idle.intensity = (+e.key) / 9;
  else if (e.key === "ArrowLeft")  RainBridge.CFG.idle.wind -= 0.1;
  else if (e.key === "ArrowRight") RainBridge.CFG.idle.wind += 0.1;
  else if ((e.key === "d" || e.key === "D") && audio)
    audio.pickRandom().then(() => audio.play()).catch(fail);
  else return;
  e.preventDefault();
});

// ── ?debug=1：滑杆与读数。正式页面没有它。
if (q.get("debug")) {
  const hud = document.createElement("div");
  hud.id = "hud";
  hud.innerHTML =
    '<label>intensity <input id="hi" type="range" min="0" max="1" step="0.01"> <b id="hiv"></b></label>' +
    '<label>character <input id="hc" type="range" min="0" max="1" step="0.01"> <b id="hcv"></b></label>' +
    '<label>wind <input id="hw" type="range" min="-1" max="1" step="0.01"> <b id="hwv"></b></label>' +
    '<div id="hs"></div>';
  document.body.appendChild(hud);
  const bind = (id, key) => {
    const el = $("#" + id);
    el.value = RainBridge.CFG.idle[key];
    el.addEventListener("input", ev => { RainBridge.CFG.idle[key] = +ev.target.value; });
  };
  bind("hi", "intensity"); bind("hc", "character"); bind("hw", "wind");
  let fps = 60, last = performance.now();
  (function poll(now) {
    fps += ((1000 / Math.max(1, now - last)) - fps) * 0.1; last = now;
    const s = bridge.stats;
    $("#hiv").textContent = s.i.toFixed(2);
    $("#hcv").textContent = s.c.toFixed(2);
    $("#hwv").textContent = s.w.toFixed(2);
    $("#hs").textContent = fps.toFixed(0) + " fps · " + s.drops + " 滴 · lvl "
      + s.level.toFixed(2) + (audio && audio.playing ? " · 跟谱" : " · 空转");
    requestAnimationFrame(poll);
  })(performance.now());
}

})().catch(e => {
  const pre = document.createElement("pre");
  pre.id = "err"; pre.textContent = String((e && e.message) || e);
  document.body.appendChild(pre);
  console.error(e);
});
</script>
</body>
</html>
